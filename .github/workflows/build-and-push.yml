name: Guacamole CI/CD - Multi-Branch

on:
  schedule:
    - cron: '0 2 * * *' # Éjszakai frissítés ellenőrzése
  workflow_dispatch:   # Manuális indítás

permissions:
  contents: write
  packages: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- VERZIÓKEZELÉS ---
      - name: Get latest Guacamole version
        id: guac-version
        run: |
          LATEST_VERSION=$(curl -s "https://hub.docker.com/v2/repositories/guacamole/guacamole/tags/?page_size=100" | \
            jq -r '.results[].name' | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | \
            sort -V | \
            tail -n 1)
          echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT

      - name: Get current version from Dockerfile
        id: current-version
        run: |
          CURRENT_VERSION=$(grep '^ARG GUAC_VER=' Dockerfile | cut -d'=' -f2 || echo "0.0.0")
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

      # --- LOGIKA: FRISSÍTÉS CSAK A DEVELOP ÁGON ---
      - name: Update Dockerfile version (only on develop)
        id: update-check
        if: github.ref == 'refs/heads/develop'
        run: |
          LATEST="${{ steps.guac-version.outputs.latest_version }}"
          CURRENT="${{ steps.current-version.outputs.current_version }}"
          if [ "$LATEST" != "$CURRENT" ]; then
            sed -i "s/^ARG GUAC_VER=.*/ARG GUAC_VER=${LATEST}/" Dockerfile
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      # --- BUILD: TEST CÍMKE (Develop ág) ---
      - name: Build and push TEST image
        if: github.ref == 'refs/heads/develop' && (steps.update-check.outputs.updated == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:test
          build-args: |
            GUAC_VER=${{ steps.guac-version.outputs.latest_version }}

      # --- BUILD: LATEST CÍMKE (Master ág) ---
      - name: Build and push STABLE image
        if: github.ref == 'refs/heads/master' && github.event_name != 'schedule'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # KÉNYSZERÍTETT MANIFEST LIST (INDEX) LÉTREHOZÁSA:
          platforms: linux/amd64
          provenance: true  # Visszakapcsoljuk, mert ez segít az Index generálásában
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.guac-version.outputs.latest_version }}
          build-args: |
            # Itt a LATEST-et használjuk, nem a CURRENT-et!
            GUAC_VER=${{ steps.guac-version.outputs.latest_version }}

      # --- VISSZAÍRÁS: Csak a develop ágon ---
      - name: Commit changes to develop
        if: github.ref == 'refs/heads/develop' && steps.update-check.outputs.updated == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Dockerfile
          git commit -m "Automated test update to ${{ steps.guac-version.outputs.latest_version }}"
          git push origin develop
